name: clubs-wiki
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node clubs_wiki.mjs
        env:
          ONLY: athletic-club,atletico-de-madrid,getafe-cf,rcd-espanyol,real-sociedad,fc-bayern-muenchen,fiorentina
        continue-on-error: true
      - if: always()
        run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add clubs clubs_index.json clubs_wiki_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "club players from wikipedia categories"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
