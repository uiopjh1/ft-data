name: comm-handles
on:
  workflow_dispatch:
    inputs:
      only: { default: '' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: timeout 900 python comm_handles.py
        env:
          ONLY: ${{ github.event.inputs.only }}
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add comm_handles_report.json
          git diff --cached --quiet && exit 0
          git commit -qm "comm-handles probe"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 3; done
