name: ballon-fetch
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'الموسم (2025 يعني 2025-26)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ballon-fetch.mjs ballon ${{ github.event.inputs.season }}
      - run: |
          git config user.name "ft-bot"
          git config user.email "ft-bot@users.noreply.github.com"
          git add ballon_auto.json
          git diff --cached --quiet || (git commit -m "ballon_auto: draft stats" && git pull --rebase -q && git push)
