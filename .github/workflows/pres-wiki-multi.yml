name: pres-wiki-multi
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: pres-wiki-multi
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "opencv-python-headless==4.10.0.84" "numpy<2"
      - run: timeout 1500 python pres_wiki_multi.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add presidents.json pres_wiki_multi_report.json
          git diff --cached --quiet || { git commit -qm "pres-wiki-multi" && (git pull --rebase --autostash -q; git push -q); }
