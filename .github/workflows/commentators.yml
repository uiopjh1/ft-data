name: commentators
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
concurrency:
  group: commentators
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: timeout 300 python commentators.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add commentators.json commentators_debug.json
          git diff --cached --quiet && exit 0
          git commit -qm "commentators update"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 8 + 2)); done
