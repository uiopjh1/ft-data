name: wiki-names-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node wiki-names-test.mjs
      - run: |
          git config user.name "ft-bot"
          git config user.email "ft-bot@users.noreply.github.com"
          git add wiki_names_test.json
          git diff --cached --quiet || { git commit -m "wiki names test" && (git push || (git pull --rebase -X theirs origin main && git push)); }
