name: pres-news-eu
on:
  workflow_dispatch:
    inputs:
      only: { default: '' }
permissions:
  contents: write
concurrency:
  group: pres-news-eu
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "opencv-python-headless==4.10.0.84" "numpy<2" googlenewsdecoder
      - run: timeout 1500 python pres_news_eu.py
        env:
          ONLY: ${{ github.event.inputs.only }}
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add pres_img_cand pres_news_eu_report.json
          git diff --cached --quiet || { git commit -qm "pres-news-eu candidates" && (git pull --rebase --autostash -q; git push -q); }
