name: espnprobe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node espnprobe.mjs
      - run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add espnprobe_result.json
          git commit -qm "tm probe"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
