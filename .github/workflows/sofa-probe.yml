name: sofa-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sofa-probe.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add probe_out.txt; git commit -m probe || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 4; done
