name: coach-watch
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coach-watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install googlenewsdecoder
      - run: python coach_watch.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          for f in coach_news.json coach_watch_log.json ; do [ -f "$f" ] && git add "$f"; done
          git commit -m "coach-watch" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 4; done
