name: gulf-photo-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node gulf-photo-probe.mjs
      - run: |
          git config user.name "ft-bot"
          git config user.email "ft-bot@users.noreply.github.com"
          git add gulf_photo_probe.json
          git diff --cached --quiet || { git commit -m "gulf photo probe" && (git push || (git pull --rebase -X theirs origin main && git push)); }
