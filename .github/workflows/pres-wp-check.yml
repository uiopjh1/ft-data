name: pres-wp-check
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: pres-wp-check
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python pres_wp_check.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add pres_wp_check.json
          git commit -qm "wp check" && (git pull --rebase --autostash -q; git push -q) || true
