name: thumbs
on:
  workflow_dispatch:
  schedule:
    - cron: '50 4 * * *'
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock sharp
      - run: node thumbs.mjs
        continue-on-error: true
      - run: node fillmissing.mjs
        continue-on-error: true
      - if: always()
        run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add thumbs thumbs_index.json thumbs_debug.json fill_report.json 2>/dev/null || git add thumbs_debug.json || true
          git diff --cached --quiet && exit 0
          git commit -qm "player thumbs"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
