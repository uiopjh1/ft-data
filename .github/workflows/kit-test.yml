name: kit-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pillow numpy
      - run: python kit/kit_check.py "Abha"
      - run: |
          git config user.name ft-bot; git config user.email bot@ft
          git add kit && git commit -m "kit test" && git pull -q --rebase && git push || true
