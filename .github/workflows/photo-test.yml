name: photo-test
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "id|when (مثال 929|1778263200000)"
        required: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: /tmp/clip_cache
          key: clip-model-v1
      - run: TEST_PHOTO="${{ github.event.inputs.spec }}" node build-stats.mjs
