name: src-probe
on: workflow_dispatch
permissions: { contents: write }
concurrency: { group: srcprobe }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: timeout 600 python -u src_probe.py
        continue-on-error: true
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          for f in src_probe.json; do [ -e $f ] && git add $f; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "src probe"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
