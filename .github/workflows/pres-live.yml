name: pres-live
# GitHub's cron is best-effort and often hours late, so this job polls by itself every hour for ~5h,
# then starts its own successor (workflow_dispatch by GITHUB_TOKEN is allowed). The hourly cron only revives the chain if it ever breaks.
on:
  workflow_dispatch:
    inputs:
      secs: { default: '18000' }
      gap: { default: '3600' }
      test: { default: '0' }
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: pres-watch${{ github.event.inputs.test == '1' && '-test' || '' }}
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "opencv-python-headless==4.10.0.84" "numpy<2" googlenewsdecoder
      - name: poll
        env:
          WATCH_APPLY: ${{ github.event.inputs.test == '1' && '0' || '1' }}
          SECS: ${{ github.event.inputs.secs || '18000' }}
          GAP: ${{ github.event.inputs.gap || '3600' }}
        run: |
          git config user.name github-actions; git config user.email a@b.c
          end=$((SECONDS+SECS)); n=0
          while [ $SECONDS -lt $end ]; do
            git pull --rebase --autostash -q || true
            python pres_watch.py; a=$?
            python pres_watch_eu.py; b=$?
            echo "{\"last_run_utc\": \"$(date -u +%FT%TZ)\", \"saudi_exit\": $a, \"eu_exit\": $b, \"cycle\": $n, \"test\": \"${{ github.event.inputs.test }}\"}" > pres_live_status.json
            n=$((n+1))
            git add presidents.json presidents_alerts.json pres_live_status.json 2>/dev/null
            if true; then for f in pres_watch_state.json pres_watch_state_eu.json; do [ -f "$f" ] && git add "$f"; done; fi
            if ! git diff --cached --quiet; then git commit -qm "pres-live" && (git pull --rebase --autostash -q; git push -q) || true; fi
            sleep $GAP
          done
          for f in pres_watch_state.json pres_watch_state_eu.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -qm "pres-live state" && (git pull --rebase --autostash -q; git push -q) || true; }
      - name: start successor
        if: always() && github.event.inputs.test != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pres-live.yml --ref main
