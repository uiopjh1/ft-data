name: tifo-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -m 30 -A "FT-app/1.0" https://tifo.elyoxe.com/v1/tv/commentators.json -o probe/tifo_comm.json -w "%{http_code}\n" > probe/tifo_status.txt 2>&1 || true
          curl -sS -m 30 -A "FT-app/1.0" https://tifo.elyoxe.com/v1/index.json -o probe/tifo_index.json || true
          ls -la probe >> probe/tifo_status.txt
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe; git commit -m "tifo probe" || true; git push
