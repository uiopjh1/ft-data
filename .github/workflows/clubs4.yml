name: clubs4
on:
  workflow_dispatch:
    inputs:
      dry: { description: 'dry run 1=yes', required: false }
      only: { description: 'slugs', required: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --max-old-space-size=6000 clubs4.mjs
        env:
          DRY: ${{ inputs.dry }}
          ONLY: ${{ inputs.only }}
      - if: always()
        run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add clubs clubs4_report*.json
          git diff --cached --quiet && exit 0
          git commit -qm "clubs4 europe rebuild"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
