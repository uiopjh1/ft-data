name: comm-news
on:
  workflow_dispatch:
    inputs:
      only: { default: '' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "opencv-python-headless==4.10.0.84" "numpy<2"
      - run: timeout 1200 python comm_news.py
        env:
          ONLY: ${{ github.event.inputs.only }}
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add comm_news_report.json; [ -d comm_img_cand ] && git add comm_img_cand || true
          git diff --cached --quiet && exit 0
          git commit -qm "comm-news candidates"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 8 + 2)); done
