name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node clubtest.mjs
        continue-on-error: true
      - run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add clubtest_report.json club_rm.json; git commit -qm clubtest; for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
