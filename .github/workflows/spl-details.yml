name: spl-details
on:
  workflow_dispatch:
  push:
    paths: ['spl-details.mjs']
  schedule:
    - cron: '47 3 * * *'
permissions: { contents: write }
concurrency: { group: spl-details }
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: timeout 1700 node spl-details.mjs
      - run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add spl_details.json
          git diff --cached --quiet && exit 0
          git commit -qm "spl details"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
