name: tv-probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -s -m 30 -A "$UA" -o ev.json -w "events http=%{http_code}\n" https://api.sofascore.com/api/v1/sport/football/scheduled-events/2026-10-29
          python3 - <<'P'
          import json
          try:
              d=json.load(open('ev.json'))
              for e in d.get('events',[]):
                  n=(e['homeTeam']['name']+' v '+e['awayTeam']['name'])
                  if any(x in n for x in ['Nassr','Riyadh','Everton','Fiorentina']): print(e['id'],n)
          except Exception as ex: print('ERR',ex, open('ev.json').read()[:200])
          P
      - run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          for id in $(python3 -c "
          import json
          d=json.load(open('ev.json'))
          print(' '.join(str(e['id']) for e in d.get('events',[]) if any(x in e['homeTeam']['name']+e['awayTeam']['name'] for x in ['Nassr','Riyadh','Everton'])))
          "); do echo "== $id"; curl -s -m 30 -A "$UA" -w "\nhttp=%{http_code}\n" https://api.sofascore.com/api/v1/tv/event/$id/country-channels | cut -c1-1500; done
      - run: |
          { echo probe; } > /dev/null
      - name: save
        if: always()
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          {
            curl -s -m 30 -A "$UA" -o ev2.json -w "events http=%{http_code}\n" https://api.sofascore.com/api/v1/sport/football/scheduled-events/2026-10-29
            for id in $(python3 -c "
          import json
          try:
              d=json.load(open('ev2.json'))
              print(' '.join(str(e['id']) for e in d.get('events',[]) if any(x in e['homeTeam']['name']+e['awayTeam']['name'] for x in ['Nassr','Riyadh','Everton','Fiorentina'])))
          except Exception as ex: print('')
          "); do echo "== $id"; curl -s -m 30 -A "$UA" -w "\nhttp=%{http_code}\n" https://api.sofascore.com/api/v1/tv/event/$id/country-channels | cut -c1-2500; done
          } > tv_probe.txt 2>&1
          git config user.name github-actions; git config user.email a@b.c
          git add tv_probe.txt; git commit -qm "tv probe result"; for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 3; done
