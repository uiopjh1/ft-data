name: comm-photos
on:
  workflow_dispatch:
    inputs:
      only: { default: '' }
      apply: { default: '0' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install "opencv-python-headless==4.10.0.84" "numpy<2"
      - run: timeout 1500 python comm_photos.py
        env:
          ONLY: ${{ github.event.inputs.only }}
          APPLY: ${{ github.event.inputs.apply }}
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          for f in comm_photos_report.json commentators_info.json; do [ -f $f ] && git add $f; done
          [ -d comm_img_cand ] && git add comm_img_cand || true
          [ -d comm_img ] && git add comm_img || true
          git diff --cached --quiet && exit 0
          git commit -qm "comm-photos"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 8 + 2)); done
