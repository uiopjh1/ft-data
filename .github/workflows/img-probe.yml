name: img-probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: timeout 300 python img_probe.py
      - run: |
          git config user.name github-actions; git config user.email a@b.c
          git add yandex_sample.html; git commit -qm probe; for i in 1 2 3; do git pull --rebase -q && git push -q && break; done
