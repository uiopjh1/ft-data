name: probe-sites17
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: timeout 600 node probe-sites17.mjs
        continue-on-error: true
      - if: always()
        run: |
          git config user.name ft-bot; git config user.email ft-bot@users.noreply.github.com
          git add probe_sites17.json
          git diff --cached --quiet && exit 0
          git commit -qm "probe sites17"; for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
